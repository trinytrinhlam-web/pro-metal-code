<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" role="img" aria-label="Bản vẽ kỹ thuật cổng sắt Pro-Metal">
  <defs>
    <radialGradient id="pmGlow" cx="50%" cy="45%" r="62%">
      <stop offset="0" stop-color="#3C6382" stop-opacity=".55"/>
      <stop offset="68%" stop-color="#3C6382" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pmBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2eef5"/>
      <stop offset="1" stop-color="#9dbccf"/>
    </linearGradient>
    <radialGradient id="pmMedal" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#1a4a66"/>
      <stop offset="100%" stop-color="#0e3a50"/>
    </radialGradient>
    <radialGradient id="pmSpark" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff7ea"/>
      <stop offset="34%" stop-color="#ffc978"/>
      <stop offset="100%" stop-color="#f0932b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pmGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="760" fill="#0e3a50"/>
  <rect width="600" height="760" fill="url(#pmGrid)"/>
  <rect width="600" height="760" fill="url(#pmGlow)"/>

  <!-- Tech nodes (logo circuit motif) -->
  <g fill="none" stroke="#7fa8bf" stroke-opacity=".55" stroke-width="1.4" stroke-linecap="round">
    <path d="M54 74h34v34"/><path d="M64 104l24 24"/>
    <path d="M546 686h-34v-34"/><path d="M536 656l-24-24"/>
  </g>
  <g fill="#9fc0d3">
    <circle cx="54" cy="74" r="4.5"/><circle cx="88" cy="108" r="3.5"/>
    <circle cx="546" cy="686" r="4.5"/><circle cx="512" cy="652" r="3.5"/>
  </g>
  <circle cx="88" cy="74" r="4.5" fill="#f0932b"/>
  <circle cx="512" cy="686" r="4.5" fill="#f0932b"/>

  <!-- Dimension lines (blueprint) -->
  <g stroke="#7fa8bf" stroke-opacity=".8" stroke-width="1.4" fill="#7fa8bf">
    <!-- top width -->
    <line x1="140" y1="152" x2="460" y2="152"/>
    <polygon points="140,152 151,147 151,157"/>
    <polygon points="460,152 449,147 449,157"/>
    <line x1="140" y1="156" x2="140" y2="180" stroke-opacity=".35"/>
    <line x1="460" y1="156" x2="460" y2="180" stroke-opacity=".35"/>
    <!-- left height -->
    <line x1="108" y1="182" x2="108" y2="560"/>
    <polygon points="108,182 103,193 113,193"/>
    <polygon points="108,560 103,549 113,549"/>
    <line x1="112" y1="182" x2="140" y2="182" stroke-opacity=".35"/>
    <line x1="112" y1="560" x2="140" y2="560" stroke-opacity=".35"/>
  </g>

  <!-- ============ IRON GATE ============ -->
  <g>
    <!-- vertical bars (masked by medallion) -->
    <g stroke="url(#pmBar)" stroke-width="4" stroke-opacity=".9" stroke-linecap="round">
      <line x1="165" y1="226" x2="165" y2="512"/>
      <line x1="192" y1="226" x2="192" y2="512"/>
      <line x1="219" y1="226" x2="219" y2="512"/>
      <line x1="246" y1="226" x2="246" y2="512"/>
      <line x1="273" y1="226" x2="273" y2="512"/>
      <line x1="327" y1="226" x2="327" y2="512"/>
      <line x1="354" y1="226" x2="354" y2="512"/>
      <line x1="381" y1="226" x2="381" y2="512"/>
      <line x1="408" y1="226" x2="408" y2="512"/>
      <line x1="435" y1="226" x2="435" y2="512"/>
    </g>

    <!-- central medallion -->
    <circle cx="300" cy="369" r="62" fill="url(#pmMedal)" stroke="#dbe9f1" stroke-width="3"/>
    <circle cx="300" cy="369" r="47" fill="none" stroke="#9dbccf" stroke-width="1.6" stroke-opacity=".8"/>
    <path d="M300 330l32 39-32 39-32-39z" fill="none" stroke="#e2eef5" stroke-width="2.4" stroke-linejoin="round"/>
    <circle cx="300" cy="369" r="7" fill="#f0932b"/>

    <!-- frame + rails + centre post -->
    <g fill="none" stroke="#e6f0f6" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round">
      <rect x="140" y="180" width="320" height="380" rx="8"/>
      <line x1="300" y1="180" x2="300" y2="560"/>
      <line x1="140" y1="226" x2="460" y2="226"/>
      <line x1="140" y1="512" x2="460" y2="512"/>
    </g>

    <!-- spear-tip finials on top -->
    <g fill="none" stroke="#9dbccf" stroke-width="2.2" stroke-linejoin="round" stroke-opacity=".85">
      <path d="M175 180l0 -16 8 -12 8 12 0 16"/>
      <path d="M235 180l0 -16 8 -12 8 12 0 16"/>
      <path d="M357 180l0 -16 8 -12 8 12 0 16"/>
      <path d="M417 180l0 -16 8 -12 8 12 0 16"/>
    </g>

    <!-- ground line + hatch -->
    <g stroke="#5f86a0" stroke-width="1.6" stroke-linecap="round">
      <line x1="96" y1="578" x2="504" y2="578"/>
      <line x1="120" y1="578" x2="108" y2="592"/>
      <line x1="156" y1="578" x2="144" y2="592"/>
      <line x1="192" y1="578" x2="180" y2="592"/>
      <line x1="228" y1="578" x2="216" y2="592"/>
      <line x1="264" y1="578" x2="252" y2="592"/>
      <line x1="300" y1="578" x2="288" y2="592"/>
      <line x1="336" y1="578" x2="324" y2="592"/>
      <line x1="372" y1="578" x2="360" y2="592"/>
      <line x1="408" y1="578" x2="396" y2="592"/>
      <line x1="444" y1="578" x2="432" y2="592"/>
      <line x1="480" y1="578" x2="468" y2="592"/>
    </g>
  </g>

  <!-- ============ WELD SPARK (accent) ============ -->
  <g>
    <circle cx="219" cy="512" r="30" fill="url(#pmSpark)"/>
    <g stroke="#ffc978" stroke-width="2" stroke-linecap="round">
      <line x1="219" y1="512" x2="205" y2="490"/>
      <line x1="219" y1="512" x2="238" y2="494"/>
      <line x1="219" y1="512" x2="243" y2="520"/>
      <line x1="219" y1="512" x2="200" y2="528"/>
    </g>
    <circle cx="219" cy="512" r="4" fill="#fff7ea"/>
    <circle cx="250" cy="500" r="2.4" fill="#ffbf66"/>
    <circle cx="196" cy="536" r="2" fill="#ffbf66"/>
    <circle cx="243" cy="530" r="1.8" fill="#ffbf66"/>
  </g>

  <!-- ============ WORDMARK ============ -->
  <g text-anchor="middle" font-family="'Be Vietnam Pro',system-ui,Segoe UI,Arial,sans-serif">
    <rect x="276" y="632" width="48" height="3" rx="1.5" fill="#f0932b"/>
    <text x="300" y="668" fill="#eaf2f7" font-size="27" font-weight="800" letter-spacing="4">PRO-METAL</text>
    <text x="300" y="692" fill="#84a9c0" font-size="12.5" font-weight="600" letter-spacing="3">THIẾT KẾ · THI CÔNG · SỬA CHỮA</text>
  </g>
</svg>
